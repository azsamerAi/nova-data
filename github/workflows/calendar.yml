name: Update economic calendar

on:
  schedule:
    - cron: "17 * * * *"   # every hour at minute 17 (UTC)
  workflow_dispatch:        # allows a manual "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download ForexFactory weekly calendar
        run: |
          curl -sSf -A "Mozilla/5.0" "https://nfs.faireconomy.media/ff_calendar_thisweek.json" -o new.json
          # keep the previous file if the download is not a non-empty JSON list
          python3 -c "import json,sys; d=json.load(open('new.json')); sys.exit(0 if isinstance(d,list) and d else 1)"
          mv new.json calendar.json

      - name: Commit if changed
        run: |
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add calendar.json
          git diff --cached --quiet || git commit -m "Update calendar"
          git push
